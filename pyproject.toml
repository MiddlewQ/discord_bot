[project]
name = "discord_bot"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
    "discord.py[voice]",
    "python-dotenv",
    "yt-dlp[default]",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
